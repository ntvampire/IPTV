name: Update IPTV Playlist and EPG

on:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "generate_playlist.py"
      - "input_channels.txt"
      - "logos/**"
      - ".github/workflows/update_playlist.yml"

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run playlist and EPG generator
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python generate_playlist.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.m3u epg.xml.gz
          if git diff --staged --quiet; then
            echo "No changes in generated files, skipping commit."
          elif git log -1 --pretty=format:'%an' | grep -qi 'github-actions'; then
            git commit --amend --reset-author -m "Auto-update playlist and custom EPG"
            git push --force-with-lease origin HEAD:main
          else
            git commit -m "Auto-update playlist and custom EPG"
            git push origin HEAD:main
          fi
