name: Update IPTV Playlist and EPG

on:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "generate_playlist.py"
      - "input_channels.txt"
      - "input_lists.txt"
      - "requirements.txt"
      - "logos/**"
      - ".github/workflows/update_playlist.yml"

permissions: {}

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run playlist and EPG generator
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python generate_playlist.py

      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add index.m3u epg.xml.gz
          if git diff --staged --quiet; then
            echo "No changes in generated files, skipping commit."
          elif git log -1 --pretty=format:'%an' | grep -qi 'github-actions'; then
            git commit --amend --reset-author -m "Auto-update playlist and custom EPG"
            git push --force-with-lease origin HEAD:main
          else
            git commit -m "Auto-update playlist and custom EPG"
            git push origin HEAD:main
          fi
